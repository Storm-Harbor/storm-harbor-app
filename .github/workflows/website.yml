name: Website

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - run: npm install --global @yarnpkg/cli-dist@4.18.0
      - run: yarn install --immutable
      - name: Validate existing application and locales
        run: yarn check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name != 'pull_request'
        id: pages
      - name: Export public website only
        env:
          PAGES_BASE_PATH: ${{ github.event_name == 'pull_request' && '/storm-harbor-app' || steps.pages.outputs.base_path }}
          WEBSITE_URL: ${{ steps.pages.outputs.base_url || 'https://storm-harbor.github.io/storm-harbor-app/' }}
        run: |
          export WEBSITE_URL="${WEBSITE_URL/#http:/https:}"
          yarn build:website
          yarn check:website
          yarn playwright install --with-deps chromium
          yarn test:website
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: website/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
